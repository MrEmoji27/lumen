[package]
name = "lumen"
version = "0.1.0"
edition = "2024"

[dependencies]
servo = { version = "0.7", optional = true }
euclid = { version = "0.22", optional = true }
url = { version = "2.5", optional = true }
dpi = { version = "0.1", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# ANGLE (GL on Direct3D 11): native WGL needs NV_DX_interop, which hybrid laptops lack.
surfman = { version = "0.14", optional = true, features = ["sm-angle-builtin", "sm-angle-default"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "aws-lc-rs"] }
adblock = "0.13"
base64 = "0.23"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37"
ureq = "3"
webview2-com = "0.39"
window-vibrancy = "0.8"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.57", features = ["devtools"] }

[features]
# The Servo engine is heavy to build; only examples that ask for it compile it.
servo = ["dep:servo", "dep:euclid", "dep:url", "dep:dpi", "dep:rustls", "dep:raw-window-handle", "dep:surfman"]

[[example]]
name = "servo_tab"
required-features = ["servo"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
