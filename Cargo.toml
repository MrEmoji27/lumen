[package]
name = "lumen"
version = "0.5.1"
edition = "2024"
default-run = "lumen"

[dependencies]
servo = { version = "0.7", optional = true }
euclid = { version = "0.22", optional = true }
url = { version = "2.5", optional = true }
dpi = { version = "0.1", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# ANGLE (GL on Direct3D 11): native WGL needs NV_DX_interop, which hybrid laptops lack.
surfman = { version = "0.14", optional = true, features = ["sm-angle-builtin", "sm-angle-default"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "aws-lc-rs"] }
adblock = "0.13"
base64 = "0.23"
dirs = "7.0.0"
flate2 = "1.1"
# UPnP IGD: open the torrent port on the router. Sync API, no TLS needed (attohttpc).
igd-next = { version = "0.18", features = ["io_sync"] }
# Luau, for the scripts a person puts in the scripts folder and agents run (agent_script.rs).
# Built from source: no Lua DLL to ship.
mlua = { version = "0.12", features = ["luau", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tao = "0.37"
ureq = "3"
webview2-com = "0.39"
window-vibrancy = "0.8"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.57", features = ["devtools"] }
# save_kdbx4 is for the tests only: they write a real KDBX4 file and read it
# back, which is the only way to exercise the parser without a KeePass install.
keepass = { version = "0.15", features = ["save_kdbx4"] }

[features]
# The Servo engine is heavy to build; only examples that ask for it compile it.
servo = ["dep:servo", "dep:euclid", "dep:url", "dep:dpi", "dep:rustls", "dep:raw-window-handle", "dep:surfman"]

[[example]]
name = "servo_tab"
required-features = ["servo"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
