<!doctype html>
<html lang="en" data-theme="dark" data-palette="graphite" data-frame="strip" data-side="left">
<head>
<meta charset="utf-8">
<title>Lumen</title>
<style>/*__FONTS__*/ /*__CSS__*/</style>
</head>
<body>
<div id="rz" aria-hidden="true"></div>

<aside id="sb">
  <header id="top" data-drag>
    <div class="nav">
      <button class="ib" id="back" aria-label="Back" data-i="back"></button>
      <button class="ib" id="fwd" aria-label="Forward" data-i="fwd"></button>
      <button class="ib" id="reload" aria-label="Reload" data-i="reload"></button>
    </div>
    <div class="win">
      <button class="ib" id="min" aria-label="Minimize" data-i="min"></button>
      <button class="ib" id="max" aria-label="Maximize" data-i="max"></button>
      <button class="ib" id="close" aria-label="Close" data-i="close"></button>
    </div>
  </header>

  <div id="omni">
    <span class="lead" data-i="search"></span>
    <input id="addr" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address">
    <div id="sugg" role="listbox" hidden></div>
  </div>

  <nav id="list">
    <div id="pins"></div>
    <div id="tabs" role="tablist" aria-label="Tabs"></div>
    <button id="newtab" class="row"><span class="fav" data-i="plus"></span><span class="title">New tab</span></button>
  </nav>

  <footer id="foot">
    <span id="mem"></span>
    <button class="ib" id="gear" aria-label="Settings" data-i="sliders"></button>
  </footer>

  <div id="menu" role="menu" hidden></div>
</aside>

<main id="stage" hidden>
  <section id="ntp" hidden>
    <div class="ntp-in">
      <div class="clock"><span id="hh"></span><span class="colon">:</span><span id="mm"></span></div>
      <div class="date" id="date"></div>
      <form id="ntp-form" autocomplete="off">
        <span class="lead" data-i="search"></span>
        <input id="ntp-q" spellcheck="false" placeholder="Search or enter address" aria-label="Search">
      </form>
      <div id="sc" class="sc"></div>
    </div>
  </section>
  <section id="set" hidden></section>
</main>
<script>/*__JS__*/</script>
</body>
</html>
