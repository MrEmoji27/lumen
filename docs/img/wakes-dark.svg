<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-label="Wakes per minute: 5,119 before, 254 after, 165 downloading, 94 idle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect x="0.5" y="0.5" width="779" height="329" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="28" y="38" font-size="17" font-weight="600" fill="#f0efec">A busy page used to wake Lumen 5,119 times a minute; now 254</text>
<text x="28" y="60" font-size="12.5" fill="#c3c2b7">Event-loop wakes per minute</text>
<line x1="360.0" x2="360.0" y1="92" y2="282" stroke="#383835" stroke-width="1"/>
<text x="360.0" y="300.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">0</text>
<line x1="514.5" x2="514.5" y1="92" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="514.5" y="300.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">2,500</text>
<line x1="669.1" x2="669.1" y1="92" y2="282" stroke="#2c2c2a" stroke-width="1"/>
<text x="669.1" y="300.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">5,000</text>
<text x="346.0" y="120.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">A page rewriting its title every 10 ms, before</text>
<path d="M360.0,104.0 L672.4,104.0 Q676.4,104.0 676.4,108.0 L676.4,122.0 Q676.4,126.0 672.4,126.0 L360.0,126.0 Z" fill="#5a5955"><title>A page rewriting its title every 10 ms, before: 5,119 wakes a minute</title></path>
<text x="684.4" y="120.0" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">5,119</text>
<text x="346.0" y="166.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">The same page, after</text>
<path d="M360.0,150.0 L371.7,150.0 Q375.7,150.0 375.7,154.0 L375.7,168.0 Q375.7,172.0 371.7,172.0 L360.0,172.0 Z" fill="#3987e5"><title>The same page, after: 254 wakes a minute</title></path>
<text x="383.7" y="166.0" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">254</text>
<text x="346.0" y="212.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">A download running (aria2 polled every 700 ms)</text>
<path d="M360.0,196.0 L366.2,196.0 Q370.2,196.0 370.2,200.0 L370.2,214.0 Q370.2,218.0 366.2,218.0 L360.0,218.0 Z" fill="#3987e5"><title>A download running (aria2 polled every 700 ms): 165 wakes a minute</title></path>
<text x="378.2" y="212.0" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">165</text>
<text x="346.0" y="258.0" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="end">An idle tab, headless</text>
<path d="M360.0,242.0 L362.9,242.0 Q365.8,242.0 365.8,244.9 L365.8,261.1 Q365.8,264.0 362.9,264.0 L360.0,264.0 Z" fill="#3987e5"><title>An idle tab, headless: 94 wakes a minute</title></path>
<text x="373.8" y="258.0" font-size="12.5" font-weight="600" fill="#f0efec" text-anchor="start">94</text>
<text x="28.0" y="320.0" font-size="12" font-weight="400" fill="#898781" text-anchor="start">Wakes of Lumen's event loop per minute, release build. The fix: a 50 ms floor on every wait, and title events Lumen never reads ignored.</text>
</svg>
