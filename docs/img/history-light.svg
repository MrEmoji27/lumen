<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-label="Empty new tab 144 to 18 MB; one Wikipedia tab 199 to 91 MB" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>
<rect x="0.5" y="0.5" width="779" height="379" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="28" y="38" font-size="17" font-weight="600" fill="#0b0b0b">The native interface took the empty window from 144 MB to 18 MB</text>
<text x="28" y="60" font-size="12.5" fill="#52514e">Private memory of Lumen and its WebView2 processes, release builds, at each step of the build</text>
